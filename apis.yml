name: ESPL
description: ESPL (Esports Players League) is a Singapore-headquartered global esports
  tournament network and platform, founded in 2019, building an open, grassroots-focused
  ecosystem for amateur competitive gaming. It runs ESPL-branded online and on-ground
  tournaments across Asia, Europe, and the Americas with a mobile-first focus alongside
  PC and console titles, operated from its Singapore headquarters with regional offices
  in Cologne and Los Angeles. ESPL is a portfolio company of 500 Global (formerly 500
  Startups), which led its seed round in 2020. As of this enrichment pass ESPL publishes
  no public developer API, OpenAPI, SDK, or documentation surface, and its espl.co domain
  did not resolve (DNS SERVFAIL) at probe time; this profile is maintained as a company
  identity record in the API Evangelist network.
